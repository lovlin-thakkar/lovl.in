<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDC Talent Roster</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: logo header, roster index, then one arch-badged profile per candidate; resumes open as PDFs. */
:root {
  --navy: #16234a; --teal: #17807b; --mint: #74dccd; --cream: #fdf6ec;
  --bg: #f7f3ec; --surface: #fffdf9; --fg: #16234a; --muted: #5a6280; --line: #e2dccf;
  --accent: #17807b; --accent-soft: #dcf2ee; --badge-bg: #16234a; --badge-fg: #fdf6ec;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1730; --surface: #16203f; --fg: #f3ede2; --muted: #a3aac4; --line: #2a3660;
  --accent: #74dccd; --accent-soft: #1b3a44; --badge-bg: #74dccd; --badge-fg: #0f1730; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1730; --surface: #16203f; --fg: #f3ede2; --muted: #a3aac4; --line: #2a3660;
  --accent: #74dccd; --accent-soft: #1b3a44; --badge-bg: #74dccd; --badge-fg: #0f1730; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--body); }
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 48px; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: grid; gap: 20px; }
.logos { display: flex; gap: 12px; align-items: center; }
.logos img { width: 64px; height: 64px; border-radius: 14px; }
.logos span { font: 500 14px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(40px, 8vw, 72px)/1 var(--display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }

.index { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; padding: 0; margin: 0; list-style: none; }
.index a { display: grid; gap: 2px; align-content: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--fg); height: 100%; }
.index a:hover { border-color: var(--accent); }
.index b { font: 700 16px var(--display); }
.index small { color: var(--muted); font-size: 15px; line-height: 1.4; }
.yoe { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.yoe strong { font: 700 28px/1 var(--display); color: var(--accent); }
.yoe span { font: 500 13px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 700 14px var(--body); padding: 3px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--fg); }
.tag.main { background: var(--badge-bg); color: var(--badge-fg); }
.seek { justify-self: start; font: 700 14px var(--body); padding: 3px 10px; border-radius: 999px; border: 1.5px solid var(--accent); color: var(--accent); }
.stack { font: 500 14px/1.5 var(--mono); color: var(--muted); }
.glance { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }

.join { margin: 0; color: var(--muted); font-size: 17px; }
.profiles { display: grid; gap: 24px; }
.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 24px; scroll-margin-top: 16px; }
.arch { width: 88px; height: 112px; background: var(--badge-bg); color: var(--badge-fg); border-radius: 44px 44px 8px 8px; display: grid; place-items: center; font: 700 30px var(--display); }
.body { display: grid; gap: 16px; min-width: 0; }
.track { font: 500 12px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0; }
h2 { font: 700 32px/1.1 var(--display); margin: 4px 0 0; letter-spacing: -0.01em; }
.summary { margin: 0; max-width: 65ch; }
dl { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 16px; margin: 0; padding-top: 16px; border-top: 1px solid var(--line); }
dt { font: 500 14px/1.9 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
dd { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font: 700 16px var(--body); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--badge-bg); color: var(--badge-fg); border-color: var(--badge-bg); }


@media (max-width: 560px) {
  .profile { grid-template-columns: 1fr; padding: 20px; }
  .arch { display: none; }
  dl { grid-template-columns: 1fr; gap: 2px; }
  dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: no-preference) { .index a, .btn { transition: border-color 0.15s, transform 0.15s; } .btn:hover { transform: translateY(-1px); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logos">
      <img src="img/community.png" alt="Gujarat Developer Community logo">
      <span>Gujarat Developer Community<br>Referrals &amp; Leads</span>
    </div>
    <h1>Meet the talent</h1>
    <ul class="index" id="index"></ul>
    <p class="join">Hiring or have a lead? Join the <a href="https://chat.whatsapp.com/FIu380MAQNqBNgo23MlkdC" target="_blank" rel="noopener">GDC Referrals &amp; Leads group</a>. Candidate contact details are in each resume.</p>
  </header>
  <section class="profiles" id="profiles" aria-label="Candidate profiles"></section>
</div>


<script>
const P = [
  { id: "dwijkumar-mistry", open: "relocation", seek: "Full-time", yoe: "8+ yrs", level: "Senior", tags: ["Medical imaging", "AI", "C++"], stack: "C++ · Python · PyTorch · Qt · VTK", city: "Vadodara", name: "Dwijkumar Mistry", track: "Medical imaging & AI software",
    summary: "Senior engineer with 8+ years building regulated medical imaging and AI software. Leads engineering across the 3D Surgical portfolio, including MySegmenter, an FDA 510(k) cleared segmentation suite.",
    rows: [["Role", "Senior Project Lead, 3D Surgical (Jajal Medical Services), Vadodara"], ["Experience", "8+ years"],
      ["Technologies", "C++, Python, PyTorch, MONAI, nnU-Net, VTK, ITK, Qt, DICOM, React, Next.js, Flutter, AWS"],
      ["Highlights", "FDA 510(k) cleared MySegmenter, cranial implant AI, surgical navigation, CardioSmart360 for the American College of Cardiology, real time control software for BARC and Bharat Dynamics"],
      ["Recognition", "IEEE India Council Best Industry Mentor 2025, IEEE NaSCoVIP 2022 speaker, CSPO"]] },
  { id: "pranali-rasal", open: "remote", seek: "Full-time", yoe: "9+ yrs", level: "Senior", tags: ["Backend"], stack: "Java · Spring Boot · Microservices", city: "Pune", name: "Pranali Rasal", track: "Java & backend development",
    summary: "Java developer with 9+ years of experience across QuinStreet, Sincro Digital and CDK Global. Her work spans REST APIs, microservices, production debugging and code reviews.",
    rows: [["Role", "Senior Java Developer, QuinStreet, Pune"], ["Experience", "9+ years"],
      ["Technologies", "Java 8/11/17, Spring Boot, Oracle, MySQL, Redshift, Elasticsearch, RabbitMQ"],
      ["Highlights", "Backend API development, production support, code reviews and technical interviews"]] },
  { id: "keyur-patel", seek: "Full-time", yoe: "4+ yrs", level: "Mid", tags: ["Full-stack", "Frontend", "Web AR"], stack: "React · TypeScript · Node.js · Three.js", city: "Ahmedabad", name: "Keyur Patel", track: "Full-stack development & web AR",
    summary: "Full-stack developer with 4+ years of experience, bringing together web applications and interactive 3D experiences. His work includes browser-based AR jewellery try-on, an e-commerce admin platform and ERPNext-backed REST services.",
    rows: [["Role", "Full Stack Developer, Plushvie Retail, Ahmedabad"], ["Experience", "4+ years"],
      ["Technologies", "React, TypeScript, Three.js, Node.js, Express, PHP, Python (Frappe), MySQL, MongoDB, GCP"],
      ["Highlights", "AR product experiences, e-commerce tooling and end-to-end feature delivery"]] },
  { id: "mann-dahiya", seek: "Full-time", yoe: "2+ yrs", level: "Mid", tags: ["Game dev", "XR", "Open to non-game roles as well"], stack: "Unity · C# · VR/AR", city: "", name: "Mann Dahiya", track: "Unity, games & XR experiences",
    summary: "Unity engineer with 2+ years of experience in gameplay systems, multiplayer experiences and VR/AR training simulations. His projects include workplace POSH training and VR fire-safety training, with experience leading a team of five developers and two designers.",
    rows: [["Role", "Unity Engineer, Twin Reality Technologies"], ["Experience", "2+ years; previously Lead Game Developer at Jabsz Gaming"],
      ["Technologies", "Unity, C#, Mirror networking, WebGL, VR/XR, AR face tracking, REST APIs"],
      ["Education", "B.E. IT, Charutar Vidya Mandal University; CGPA 8.49"],
      ["Highlights", "LAN multiplayer, WebGL applications, interactive simulations and team leadership"]] },
  { id: "dhairya-khatri", seek: "Intern or full-time", yoe: "Student", level: "Final year", tags: ["Full-stack", "AI"], stack: "React · Node.js · FastAPI · MongoDB", city: "Vadodara", name: "Dhairya Khatri", track: "Full-stack development & AI applications",
    summary: "Final-year computer science student with projects spanning AI code review and retrieval-augmented financial guidance. His builds include CodeOrbit, using GitHub webhooks, and Zen Wealth, using MongoDB Atlas vector search.",
    rows: [["Education", "Final-year B.Tech CSE, Parul University, Vadodara; CGPA 7.91"],
      ["Technologies", "JavaScript, TypeScript, Java, Python, React, Node.js, Express, FastAPI, MongoDB, MySQL, Firebase, Supabase"],
      ["Projects", "CodeOrbit and Zen Wealth"], ["Highlights", "1000+ DSA problems; LeetCode rating 1625; CodeChef 2-star"]] },
  { id: "rushit-soni", open: "relocation to Ahmedabad", seek: "Internship", yoe: "Student", level: "Final year", tags: ["AI engineering", "Full-stack", "MERN"], stack: "Python · FastAPI · React · Node.js · RAG", city: "Vadodara", name: "Rushit Soni", track: "AI engineering & full-stack development",
    summary: "Final-year M.Tech student in ICT (Machine Learning) who builds AI products end to end. Projects include an adaptive learning portal with a RAG-grounded tutor, an LLM-powered support triage system and a WhatsApp shop assistant for small retailers.",
    rows: [["Education", "M.Tech ICT (Machine Learning), Dhirubhai Ambani University, Gandhinagar; CPI 8.91. B.E. CSE, MSU Baroda; CPI 9.03"],
      ["Seeking", "Final-semester internship in AI engineering, full-stack with AI or MERN"],
      ["Technologies", "Python, JavaScript, SQL, RAG, Hugging Face, ModernBERT, React, Redux Toolkit, Node.js, Express, FastAPI, MongoDB, MySQL, Supabase, n8n"],
      ["Research", "Privacy-risk classification with a 3-LLM judge ensemble, distilled into a ModernBERT model"],
      ["Highlights", "GATE CSIT 2025: AIR 3207, 98.12 percentile; GATE DSAI 2024 qualified"]] },
  { id: "harshal-bhavsar", open: "relocation", seek: "Internship", yoe: "Student", level: "Intern exp.", tags: ["Backend", "DevOps"], stack: "Python · FastAPI · Docker", city: "Vadodara", name: "Harshal Bhavsar", track: "Backend development & infrastructure projects",
    summary: "Computer science student building experience in backend services and self-hosted infrastructure. His internship work includes Python Azure Functions and MySQL schema design, alongside a Raspberry Pi server project using Docker.",
    rows: [["Education", "B.Tech CSE, Parul University, Vadodara; expected 2027"], ["Experience", "Backend Developer Intern, Consult Anubhav, May - Aug 2023"],
      ["Technologies", "Java, Python, Rust, Flask, FastAPI, MySQL, MongoDB, Docker, Linux, Cloudflare"],
      ["Highlights", "Harvard CS50x; 900+ DSA problems across coding platforms"]] },
];
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const initials = n => n.split(" ").map(w => w[0]).join("");
const first = n => n.split(" ")[0];
const tagHtml = p => `<span class="tags">${p.tags.map((t, i) => `<span class="tag${i ? "" : " main"}">${esc(t)}</span>`).join("")}</span>`;

document.getElementById("index").innerHTML = P.map(p =>
  `<li><a href="#${p.id}"><b>${esc(p.name)}</b><small>${p.yoe} · ${esc(p.seek)}${p.open ? `<br>Open to ${p.open}` : ""}<br>${esc(p.tags.join(", "))}</small></a></li>`).join("");

document.getElementById("profiles").innerHTML = P.map(p => `
  <article class="profile" id="${p.id}">
    <div class="arch" aria-hidden="true">${initials(p.name)}</div>
    <div class="body">
      <h2>${esc(p.name)}</h2>
      <div class="glance"><span class="yoe"><strong>${p.yoe}</strong><span>${esc(p.level)}${p.city ? " · " + esc(p.city) : ""}</span></span><span class="seek">${esc(p.seek)}</span>${p.open ? `<span class="seek">Open to ${p.open}</span>` : ""}${tagHtml(p)}</div>
      <p class="summary">${esc(p.summary)}</p>
      <dl>${p.rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}
      </dl>
      <div class="actions">
        <a class="btn primary" href="pdf/${p.id}.pdf" target="_blank" rel="noopener">${esc(first(p.name))}'s resume (PDF)</a>
      </div>
    </div>
  </article>`).join("");


</script>
</body>
</html>
