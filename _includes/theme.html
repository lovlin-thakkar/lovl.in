<script>
  // set before first paint so a saved dark theme never flashes light
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
  })();
</script>
